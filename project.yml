name: Checklist

options:
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 1. Your Apple Developer team ID (a free Apple ID works). Find it in
    #    Xcode > Settings > Accounts, or set it in the Signing tab after generating.
    DEVELOPMENT_TEAM: ""
    # 2. Change to something unique to you, e.g. com.yourname
    BUNDLE_PREFIX: com.example
    # Shared by the app and the widget so both see the same task list.
    APP_GROUP_ID: $(TeamIdentifierPrefix)$(BUNDLE_PREFIX).checklist

targets:
  Checklist:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    dependencies:
      - target: ChecklistWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).checklist
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Checklist
        LSMinimumSystemVersion: "14.0"
        AppGroupID: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_PREFIX).checklist
            CFBundleURLSchemes:
              - checklist
    entitlements:
      path: App/Checklist.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)

  ChecklistWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).checklist.widget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Checklist
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ChecklistWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
